### REST Data HTTP service
server.port=8096
server.servlet.context-path=/DSA-WEB-RESTService/rest

### JDBC connection to Spark SQL Thrift Server
spring.datasource.url=jdbc:hive2://localhost:10000
spring.datasource.driver-class-name=org.apache.hive.jdbc.HiveDriver
#spring.datasource.username=hive
#spring.datasource.password=

# HikariCP: Keep connections in auto-commit mode (Hive does not support transactions)
spring.datasource.hikari.auto-commit=true

# Disable JPA/Hibernate entirely — using JdbcTemplate for Hive queries
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

### logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# SpringBoot Security
spring.security.user.name=developer
spring.security.user.password=iis
